<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" style="background:#000">
<defs>
  <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fffbe0"/>
    <stop offset="40%" stop-color="#f5c842"/>
    <stop offset="100%" stop-color="rgba(200,169,110,0)"/>
  </radialGradient>
  <radialGradient id="earthGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#88aaff"/>
    <stop offset="100%" stop-color="#4488ff"/>
  </radialGradient>
  <style>text { font-family: 'Courier New', monospace; }</style>
</defs>

<!-- Background -->
<rect width="600" height="700" fill="#000"/>

<!-- RING 1 — bottom side (bl to br) -->
<ellipse cx="300" cy="500" rx="173.2" ry="95.3" fill="none" stroke="rgba(26,138,114,0.95)" stroke-width="2.2"/>
<!-- RING 2 — right side (apex to br) -->
<ellipse cx="386.6" cy="350" rx="173.2" ry="95.3" transform="rotate(60 386.6 350)" fill="none" stroke="rgba(26,138,114,0.95)" stroke-width="2.2"/>
<!-- RING 3 — left side (bl to apex) -->
<ellipse cx="213.4" cy="350" rx="173.2" ry="95.3" transform="rotate(-60 213.4 350)" fill="none" stroke="rgba(26,138,114,0.95)" stroke-width="2.2"/>

<!-- Triangle mask — black fill hides ring interiors -->
<polygon points="300,100 473.2,500 126.8,500" fill="#000"/>

<!-- Triangle stroke -->
<polygon points="300,100 473.2,500 126.8,500" fill="none" stroke="rgba(26,138,114,0.85)" stroke-width="2.5"/>

<!-- Dashed lines vertex to center -->
<line x1="300" y1="100" x2="300" y2="300" stroke="rgba(26,138,114,0.7)" stroke-width="1.2" stroke-dasharray="4,6"/>
<line x1="473.2" y1="500" x2="300" y2="300" stroke="rgba(26,138,114,0.7)" stroke-width="1.2" stroke-dasharray="4,6"/>
<line x1="126.8" y1="500" x2="300" y2="300" stroke="rgba(26,138,114,0.7)" stroke-width="1.2" stroke-dasharray="4,6"/>

<!-- Mars orbit — dashed red -->
<circle cx="300" cy="300" r="50" fill="none" stroke="rgba(180,60,20,0.75)" stroke-width="1.4" stroke-dasharray="3,4"/>
<!-- Earth orbit -->
<circle cx="300" cy="300" r="33" fill="none" stroke="rgba(26,138,114,0.95)" stroke-width="1.8"/>
<!-- Venus orbit -->
<circle cx="300" cy="300" r="23" fill="none" stroke="rgba(26,138,114,0.45)" stroke-width="0.7"/>
<!-- Mercury orbit -->
<circle cx="300" cy="300" r="13" fill="none" stroke="rgba(26,138,114,0.3)" stroke-width="0.6"/>

<!-- Mars dot -->
<circle cx="350" cy="300" r="3.5" fill="rgba(200,70,30,0.9)"/>
<!-- Earth dot — blue -->
<circle cx="300" cy="267" r="4" fill="#4488ff"/>

<!-- Sun — black base to cover triangle lines -->
<circle cx="300" cy="300" r="17" fill="#000"/>
<!-- Sun rays -->
<line x1="300" y1="291" x2="300" y2="285" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<line x1="309" y1="294" x2="314" y2="289" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<line x1="309" y1="309" x2="314" y2="314" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<line x1="300" y1="309" x2="300" y2="315" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<line x1="291" y1="309" x2="286" y2="314" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<line x1="291" y1="294" x2="286" y2="289" stroke="rgba(255,220,100,0.5)" stroke-width="1"/>
<!-- Sun glow -->
<circle cx="300" cy="300" r="16" fill="url(#sunGrad)"/>
<!-- Sun core -->
<circle cx="300" cy="300" r="7" fill="#fff5a0"/>

<!-- Race nodes -->
<!-- Apex — circle -->
<circle cx="300" cy="100" r="8" fill="#1a8a72"/>
<!-- BR — diamond -->
<polygon points="473.2,490 483.2,500 473.2,510 463.2,500" fill="#1a8a72"/>
<!-- BL — triangle -->
<polygon points="126.8,490 136.8,510 116.8,510" fill="#1a8a72"/>

<!-- Labels -->
<text x="300" y="620" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="rgba(26,138,114,0.95)" letter-spacing="6">THE COVENANT</text>
<text x="300" y="642" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="rgba(26,138,114,0.75)" letter-spacing="3">THREE RACES — ONE MISSION</text>
</svg>
