<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESTRICTED — Covenant Access Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Share Tech Mono',monospace;
}

.door-scene{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:8vh;
}

.door-bg{
  position:absolute;
  inset:0;
  background:url('images/Limbo_-_The_Secret_Door.png') center center/cover no-repeat;
  animation:fade-in 2.5s ease forwards;
  opacity:0;
}

.door-vignette{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 40%, transparent 70%),
    linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 25%);
}

.door-content{
  position:relative;
  z-index:10;
  text-align:center;
  animation:rise-in 3s ease 1.5s forwards;
  opacity:0;
}

.door-eyebrow{
  font-family:'Share Tech Mono',monospace;
  font-size:0.65rem;
  letter-spacing:0.3em;
  color:rgba(255,51,51,0.8);
  margin-bottom:1.2rem;
  text-transform:uppercase;
}

.door-line{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,5vw,3.5rem);
  color:#f0ece0;
  letter-spacing:0.08em;
  line-height:1.1;
  text-shadow:0 0 40px rgba(0,0,0,0.9);
  margin-bottom:0.5rem;
}

.door-line-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(0.7rem,1.5vw,0.9rem);
  color:rgba(200,169,110,0.7);
  letter-spacing:0.2em;
  margin-bottom:3rem;
}

.enter-btn{
  display:inline-block;
  font-family:'Share Tech Mono',monospace;
  font-size:0.75rem;
  letter-spacing:0.35em;
  text-transform:uppercase;
  color:#1a8a72;
  border:1px solid rgba(26,138,114,0.6);
  padding:0.9rem 2.5rem;
  text-decoration:none;
  background:rgba(0,0,0,0.6);
  cursor:pointer;
  transition:all 0.3s ease;
  animation:btn-pulse 2.5s ease-in-out infinite;
  position:relative;
}

.enter-btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(26,138,114,0.05);
  transition:background 0.3s;
}

.enter-btn:hover{
  color:#fff;
  border-color:rgba(26,138,114,1);
  background:rgba(26,138,114,0.15);
  animation:none;
  box-shadow:0 0 20px rgba(26,138,114,0.4);
}

.warning-text{
  margin-top:1.5rem;
  font-size:0.6rem;
  letter-spacing:0.2em;
  color:rgba(255,51,51,0.5);
}

@keyframes fade-in{
  0%{opacity:0}
  100%{opacity:1}
}

@keyframes rise-in{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}

@keyframes btn-pulse{
  0%,100%{box-shadow:0 0 8px rgba(26,138,114,0.3)}
  50%{box-shadow:0 0 20px rgba(26,138,114,0.6)}
}

/* Scanline overlay */
.scanlines{
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events:none;
  z-index:5;
}

@media(max-width:600px){
  .door-line{font-size:1.8rem}
  .enter-btn{padding:0.8rem 1.8rem;font-size:0.65rem}
}
</style>
</head>
<body>

<div class="door-scene">
  <div class="door-bg"></div>
  <div class="door-vignette"></div>
  <div class="scanlines"></div>

  <div class="door-content">
    <div class="door-eyebrow">⚠ COVENANT RESTRICTED ACCESS — SECTOR 7</div>
    <div class="door-line">They found what was</div>
    <div class="door-line">never meant to be found.</div>
    <div class="door-line-sub">// BREACH EVENT — LIMBO NODE — CYCLE UNKNOWN //</div>
    <a href="node.html" class="enter-btn">ENTER THE NODE</a>
    <div class="warning-text">// UNAUTHORIZED ACCESS IS LOGGED AND MONITORED //</div>
  </div>
</div>

</body>
</html>
